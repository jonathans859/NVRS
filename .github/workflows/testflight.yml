name: TestFlight

# Every push touching ios/ builds both platforms and uploads them to TestFlight.
# The internal group "Core" has automatic distribution enabled, so builds reach
# testers as soon as App Store Connect finishes processing.
#
# Both platforms share ONE App Store Connect app record (universal purchase):
# the iOS and macOS targets use the same bundle id, and the record must have the
# macOS platform added before the first macOS upload. asc infers the platform
# from the file it is given (.ipa vs .pkg), so nothing has to disambiguate it.
#
# The pipeline itself lives in jonathans859/apple-ci, shared with every app on
# this Apple account: archive, export, upload, versioning and the one shared
# Apple Development certificate are defined once there rather than six times.
#
# iOS and macOS live in SEPARATE Xcode projects on purpose -- gym reads build
# settings through the wrong scheme in a multi-scheme project and packages the
# Mac export as an ipa. One XcodeGen spec per platform avoids it entirely.

on:
  push:
    branches: [main]
    paths:
      # Deliberately no self-reference: a CI-only edit should not mint a
      # tester-visible build with no app change. Safe because the pipeline
      # itself lives in jonathans859/apple-ci and is exercised there.
      - "ios/**"
  workflow_dispatch:

# Serialize uploads against the one app record. The iOS and macOS jobs of a
# single run may safely overlap: App Store Connect processes them independently.
concurrency:
  group: ios-testflight
  cancel-in-progress: true

jobs:
  ios:
    uses: jonathans859/apple-ci/.github/workflows/testflight.yml@v1
    secrets: inherit
    with:
      platform: ios
      working-directory: ios
      project: NVRS.xcodeproj
      scheme: NVRS
      xcodegen-spec: project.yml
      app-id: "6792317849"
      artifact-name: NVRS-ipa

  macos:
    uses: jonathans859/apple-ci/.github/workflows/testflight.yml@v1
    secrets: inherit
    with:
      platform: macos
      working-directory: ios
      project: NVRSMac.xcodeproj
      scheme: NVRSMac
      xcodegen-spec: project-mac.yml
      app-id: "6792317849"
      artifact-name: NVRS-mac-pkg
