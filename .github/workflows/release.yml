name: Release

# Publishing a GitHub release promotes the builds testflight.yml already uploaded
# for the tagged commit -- no rebuild, byte-identical binaries. The release body
# becomes the TestFlight "What to Test" text, both platforms are distributed to
# the external tester group, and the signed IPA and PKG are attached to the
# release.
#
# Two tag forms, because Beta App Review is per marketing version, not per build:
#   vX.Y.Z    - new marketing version; its first external build waits on review,
#               per platform (iOS and macOS queue independently).
#   vX.Y.Z-bN - re-release of the SAME version from a later commit, usually
#               review-free. The default tier for small fixes.
# The tag is validated against ios/project.yml at the tagged commit.
#
# NOTE: testflight.yml only fires on ios/**, so tag a commit that actually built.
# Tagging a docs- or addon-only commit leaves no build for that SHA, and this
# waits for it and then fails.

on:
  release:
    types: [published]

permissions:
  contents: write # attach the IPA and PKG to the release
  actions: read # locate and download the build run's artifacts

jobs:
  ios:
    uses: jonathans859/apple-ci/.github/workflows/release.yml@v1
    secrets: inherit
    with:
      app-id: "6792317849"
      build-workflow: testflight.yml
      artifact-name: NVRS-ipa
      platforms: IOS
      working-directory: ios
      version-file: project.yml
      groups: ${{ vars.TESTFLIGHT_EXTERNAL_GROUPS || 'External' }}

  macos:
    uses: jonathans859/apple-ci/.github/workflows/release.yml@v1
    secrets: inherit
    with:
      app-id: "6792317849"
      build-workflow: testflight.yml
      artifact-name: NVRS-mac-pkg
      platforms: MAC_OS
      working-directory: ios
      # The macOS spec carries its own MARKETING_VERSION, kept in sync with the
      # iOS one; validate the tag against the spec the build actually used.
      version-file: project-mac.yml
      groups: ${{ vars.TESTFLIGHT_EXTERNAL_GROUPS || 'External' }}

  # The NVDA add-on is the other half of the product: without it there is nothing
  # for the app to receive. It ships on the same GitHub release, built here rather
  # than by hand so a release can never go out with a stale or missing add-on.
  #
  # Its version is its own (addon/manifest.ini), deliberately not the app's
  # MARKETING_VERSION: NVDA's add-on store uses that number, and the two halves
  # have their own compatibility story. Say which add-on version a release carries
  # in the release notes.
  addon:
    name: NVDA add-on
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needs tags and history to diff against the last release

      # Only ship the add-on when it actually changed. Re-attaching a byte-identical
      # file to every release invites people to reinstall something that did not
      # move, and makes "which release changed the add-on?" unanswerable.
      - name: Has the add-on changed since the last release?
        id: check
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          PREV=$(git tag --sort=-creatordate | grep -v "^${TAG}$" | head -1 || true)
          if [ -z "$PREV" ]; then
            echo "No previous tag - first release, attaching."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Comparing addon/ against $PREV"
          if git diff --quiet "$PREV" HEAD -- addon/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Add-on unchanged since $PREV - nothing to attach."
            exit 0
          fi
          # It changed, so the version must have moved: NVDA identifies an add-on
          # by its manifest version, and shipping different code under a version
          # a user already has means their install silently never updates.
          OLD_V=$(git show "$PREV:addon/manifest.ini" | sed -n 's/^version = //p')
          NEW_V=$(sed -n 's/^version = //p' addon/manifest.ini)
          if [ "$OLD_V" = "$NEW_V" ]; then
            echo "::error::addon/ changed since $PREV but manifest.ini version is still $NEW_V. Bump it, or NVDA will not offer the update."
            exit 1
          fi
          echo "Add-on $OLD_V -> $NEW_V"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Nothing else compiles this code -- the add-on is plain Python run inside
      # NVDA, so a syntax error would otherwise reach a user's screen reader.
      - name: Byte-compile the add-on
        if: steps.check.outputs.changed == 'true'
        run: python3 -m compileall -q addon

      - name: Build the add-on
        if: steps.check.outputs.changed == 'true'
        run: python3 tools/build_addon.py

      - name: Attach it to the release
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          ls -la dist/
          gh release upload "$TAG" dist/*.nvda-addon --clobber
