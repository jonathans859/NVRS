name: NVRS
options:
  bundleIdPrefix: com.jonathan859
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  NVRS:
    type: application
    platform: iOS
    sources:
      - NVRS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jonathan859.nvrs
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: NVRS/Info.plist
      properties:
        CFBundleDisplayName: NVRS
        # Without these two the generated Info.plist carries a LITERAL 1.0/1:
        # MARKETING_VERSION and CURRENT_PROJECT_VERSION are build settings, and
        # XcodeGen does not map them into the plist by itself. The version CI
        # injects then never reaches the bundle, and Xcode renumbers the build
        # sequentially at export -- which silently breaks anything that promotes
        # a build by version + build number.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: >-
          NVRS connects to your PC over your Tailscale network to receive
          NVDA speech.
# The macOS app lives in project-mac.yml (separate Xcode project) so
# fastlane's platform detection never mixes the two.
